<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register School</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="register-body">
  <main class="register-card">
    <div class="logo">
      <img class="logo-img" src="assets/rtb-logo.png" alt="RTB Rwanda TVET Board">
    </div>

    <div class="register-title">REGISTER</div>
    <div class="horizontal-steps">
      <div class="h-step active">
        <span class="h-num">1</span>
        <span class="h-label">Personal Info.</span>
      </div>
      <div class="h-step">
        <span class="h-num">2</span>
        <span class="h-label">Address Info.</span>
      </div>
    </div>

    <form class="register-form">
      <div class="field">
        <label>Province</label>
        <select><option>Northern</option></select>
      </div>
      <div class="field">
        <label>District</label>
        <select><option>Huye</option></select>
      </div>
      <div class="field">
        <label>Sector</label>
        <select><option>Tumba</option></select>
      </div>
      <div class="field">
        <label>Cell</label>
        <select><option>Cyarwa</option></select>
      </div>
      <div class="field">
        <label>Village</label>
        <select><option>Ubumwe</option></select>
      </div>
      <span></span>
      <a class="register-submit" href="dashboard.html">Register</a>
      <div class="already">Already registered?<a href="login.html"> <b>Login</b></a></div>
    </form>
  </main>
</body>
</html>
